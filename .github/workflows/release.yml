name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require successful cross-platform and web CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" | jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')
          test "$passed" -gt 0
      - name: Test installer before signing
        run: python -m unittest discover -s tests
      - name: Build zipapp
        run: python scripts/build_pyz.py --output dm-local.pyz
      - name: Create checksum manifest
        run: |
          cp install/install.sh install/install.ps1 dmlocal/pins.py .
          sha256sum dm-local.pyz install.sh install.ps1 pins.py > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign zipapp with keyless Sigstore
        run: |
          cosign sign-blob --yes --bundle dm-local.pyz.sigstore.json dm-local.pyz
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dm-local.pyz
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          dm-local.pyz SHA256SUMS SHA256SUMS.sigstore.json dm-local.pyz.sigstore.json install.sh install.ps1 pins.py

  bootstrap:
    name: Signed release bootstrap / ${{ matrix.os }}
    needs: release
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install signed release on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          DM_LOCAL_VERSION: ${{ github.ref_name }}
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$DM_LOCAL_VERSION/install.sh" -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh"
          "$HOME/.local/bin/dm-local" version
          "$HOME/.local/bin/dm-local" doctor --json
          "$HOME/.local/bin/dm-local" list --json
          "$HOME/.local/bin/dm-local" uninstall --all --yes
          test ! -e "$HOME/.local/bin/dm-local"
      - name: Install signed release on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          DM_LOCAL_VERSION: ${{ github.ref_name }}
        run: |
          Invoke-WebRequest -UseBasicParsing "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:DM_LOCAL_VERSION/install.ps1" -OutFile "$env:RUNNER_TEMP\install.ps1"
          & "$env:RUNNER_TEMP\install.ps1"
          & "$env:LOCALAPPDATA\DecisionModels\bin\dm-local.cmd" version
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer version failed.' }
          & "$env:LOCALAPPDATA\DecisionModels\bin\dm-local.cmd" doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer doctor --json failed.' }
          & "$env:LOCALAPPDATA\DecisionModels\bin\dm-local.cmd" list --json
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer list --json failed.' }
          & "$env:LOCALAPPDATA\DecisionModels\bin\dm-local.cmd" uninstall --all --yes
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed.' }
          if (Test-Path "$env:LOCALAPPDATA\DecisionModels") { throw 'Uninstall left installer state.' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains "$env:LOCALAPPDATA\DecisionModels\bin") { throw 'Uninstall left its PATH entry.' }
          python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall damaged the shared Python runtime.' }
