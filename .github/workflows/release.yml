name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build zipapp
        run: python scripts/build_pyz.py --output dm-local.pyz
      - name: Create checksum manifest
        run: sha256sum dm-local.pyz > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign zipapp with keyless Sigstore
        run: cosign sign-blob --yes --bundle dm-local.pyz.sigstore.json dm-local.pyz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dm-local.pyz
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          dm-local.pyz SHA256SUMS dm-local.pyz.sigstore.json install/install.sh install/install.ps1 dmlocal/pins.py
