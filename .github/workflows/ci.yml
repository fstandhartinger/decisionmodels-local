name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Typecheck web
        run: npm run typecheck
      - name: Test web
        run: npm test
      - name: Build web
        run: npm run build

  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Build deterministic zipapp
        run: python scripts/build_pyz.py --output dist/dm-local.pyz
      - name: Check zipapp doctor command
        run: python dist/dm-local.pyz doctor --json
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install/install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

  e2e-tiny:
    name: Tiny real-model installer smoke / ${{ matrix.os }}
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/build_pyz.py --output dist/dm-local.pyz
      - name: Install the hidden Qwen3 0.6B GGUF fixture and test the real endpoint
        run: |
          python dist/dm-local.pyz install test-tiny --usage individual --accept --yes --port 18484
          python dist/dm-local.pyz test test-tiny
      - name: Diagnose failed real-model smoke
        if: failure()
        run: python dist/dm-local.pyz logs test-tiny --lines 80
      - name: Remove smoke-test weights
        if: always()
        run: python dist/dm-local.pyz uninstall test-tiny --yes
