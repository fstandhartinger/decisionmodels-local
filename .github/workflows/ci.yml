name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Build deterministic zipapp
        run: python scripts/build_pyz.py --output dist/dm-local.pyz
      - name: Check zipapp doctor command
        run: python dist/dm-local.pyz doctor --json
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install/install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

  e2e-tiny:
    name: Tiny real-model installer smoke / ${{ matrix.os }}
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/build_pyz.py --output dist/dm-local.pyz
      - name: Check for verified llama.cpp release asset
        id: pin
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then key=macos-arm64-metal; else key=linux-x86_64-cpu; fi
          if python -c "from dmlocal.pins import LLAMA_CPP_ASSETS; import sys; sys.exit(0 if LLAMA_CPP_ASSETS.get('$key') else 1)"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: official llama.cpp has no SHA-256-pinned $key release asset." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the hidden Qwen3 0.6B GGUF fixture and test the real endpoint
        if: steps.pin.outputs.enabled == 'true'
        run: |
          python dist/dm-local.pyz install test-tiny --usage individual --accept --yes --port 18484
          python dist/dm-local.pyz test test-tiny
      - name: Remove smoke-test weights
        if: always() && steps.pin.outputs.enabled == 'true'
        run: python dist/dm-local.pyz uninstall test-tiny --yes
